<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiftSync 測試</title>
<style>
:root{color-scheme:light dark;
  --bg:#eef0ee;--surface:#fff;--line:#cfd5d2;--fg:#16201d;--muted:#5b6762;
  --pass:#2f8f4e;--fail:#d23a2e;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614;--surface:#1a211e;--line:#33403b;--fg:#e8edea;--muted:#9aa8a2}}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 60px;background:var(--bg);color:var(--fg);
  font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0}
.sub{color:var(--muted);font-size:.88rem;margin:0}
.bar{position:sticky;top:0;z-index:2;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tally{font-family:var(--mono);font-size:1.1rem;font-weight:600}
.tally .p{color:var(--pass)}.tally .f{color:var(--fail)}
button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);
  border-radius:8px;padding:12px 14px;font-size:.88rem;color:var(--muted)}
.note code{font-family:var(--mono);font-size:.85em;background:var(--bg);padding:1px 5px;border-radius:4px}
.note b{color:var(--fg)}
h2{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin:18px 0 6px;font-weight:700}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
li{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline;
  padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:7px;font-size:.9rem}
li .tag{font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.06em}
li.ok .tag{color:var(--pass)}li.no{border-color:var(--fail)}li.no .tag{color:var(--fail)}
li .why{display:block;color:var(--muted);font-family:var(--mono);font-size:.76rem;
  margin-top:3px;word-break:break-all}
.hide{display:none}
iframe{position:fixed;left:-9999px;top:0;width:360px;height:780px;border:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>LiftSync 測試</h1>
  <p class="sub">在 iframe 裡載入真正的 <code>index.html</code> 並操作它，不是測一份副本 —— 改了 App 之後直接重新整理這一頁就會重跑。</p>

  <div class="bar">
    <span class="tally" id="tally">執行中…</span>
    <button type="button" id="rerun">重跑</button>
    <button type="button" id="onlyfail">只看失敗</button>
  </div>

  <div class="note" id="howto">
    <b>要用網頁伺服器開啟。</b>直接雙擊這個檔案的話，瀏覽器不允許它讀取 iframe 裡的
    <code>index.html</code>。在這個資料夾執行 <code>python -m http.server 8000</code>，
    然後開 <code>http://localhost:8000/test.html</code>。
  </div>

  <div class="note">
    測試會把 <b>localStorage 的內容先備份、跑完還原</b>，所以不會動到你的訓練紀錄。
    不過還是建議在本機跑，不要在已經部署、裝在手機上的網址跑。
  </div>

  <div id="out"></div>
</div>

<!-- The suite runs inside the app's own window, so it can reach the top-level
     let/const bindings that never become properties of globalThis. type="text/plain"
     keeps it inert here; the runner injects it as a real script after the app boots. -->
<script type="text/plain" id="suite">
(async()=>{
const R=[];let group="";
const G=n=>{group=n};
const ok=(name,cond,detail)=>R.push({group,name,pass:!!cond,detail:detail==null?"":String(detail)});
const settle=()=>new Promise(r=>setTimeout(r,0));

/* ---- stubs: capture what the app would emit, instead of emitting it ---- */
let buzzes=0,beeped=0,hiddenFlag=false,notified=null;
const notes=[];
const realBeep=beep;
beep=()=>{beeped++};
navigator.vibrate=()=>{buzzes++;return true};
Object.defineProperty(window,"Notification",{configurable:true,
  value:Object.assign(function(){},{permission:"granted",requestPermission:async()=>"granted"})});
Object.defineProperty(navigator,"serviceWorker",{configurable:true,value:{ready:Promise.resolve({
  showNotification:(t,o)=>{notified={t,o};notes.push({close(){}});return Promise.resolve()},
  getNotifications:()=>Promise.resolve(notes.splice(0))})}});
Object.defineProperty(document,"hidden",{configurable:true,get:()=>hiddenFlag});

const RK=KEY+"-rest";
const card=i=>document.querySelectorAll("#hist button.hitem")[i];
const fresh=()=>{S=normalize(seed());S.sample=false;wEdit=null;editing=null;stopRest();renderAll();};
const typeName=v=>{$("c-name").value=v;$("c-name").dispatchEvent(new Event("input"))};
const submitCustom=()=>$("custom-form").dispatchEvent(new Event("submit",{cancelable:true}));
const openManage=()=>{renderPicker();if($("custom-box").hidden)$("custom-manage").click()};
const firstRow=()=>$("custom-list").querySelector("li").querySelectorAll("button");
const importFile=async obj=>{
  const dt=new DataTransfer();
  dt.items.add(new File([JSON.stringify(obj)],"backup.json",{type:"application/json"}));
  $("import-file").files=dt.files;
  $("import-file").dispatchEvent(new Event("change"));
  for(let i=0;i<40&&$("import-confirm").hidden;i++)await settle();
};

try{

/* ============================ normalize ============================ */
G("normalize：修補載入與匯入的資料");
{
  const n=normalize({workouts:[
    {date:"2026-09-01",exercises:[{name:"臥推",sets:[{kg:60,reps:5}]}]},
    {date:"2026-08-30",exercises:[{name:"硬舉",sets:[{kg:100,reps:3}]}]},
    {date:"2026-08-28",exercises:[{name:"臥推",sets:[{kg:55,reps:5}]}]}]});
  ok("補上缺少的 id",n.workouts.every(w=>w.id)&&new Set(n.workouts.map(w=>w.id)).size===3,
     n.workouts.map(w=>w.id).join(","));
}
{
  const n=normalize({workouts:[{id:"x",date:"2026-01-01",exercises:[]},{id:"x",date:"2026-01-02",exercises:[]}]});
  ok("拆開重複的 id",n.workouts[0].id!==n.workouts[1].id,n.workouts.map(w=>w.id).join(","));
}
{
  const n=normalize({workouts:[],custom:{},routines:{},bodyweight:{}});
  ok("非陣列的 custom 轉成陣列",Array.isArray(n.custom));
  ok("非陣列的 routines 轉成陣列",Array.isArray(n.routines));
  ok("非陣列的 bodyweight 轉成陣列",Array.isArray(n.bodyweight));
  S=n;S.sample=false;renderAll();
  ok("轉換後仍能 render",allEx().length>0);
}
{
  const n=normalize({workouts:[
    {date:"2026-09-01",exercises:[{name:"臥推",sets:[{kg:60,reps:5}]}]},
    {exercises:[{name:"硬舉",sets:[]}]},
    {date:"亂寫",exercises:[]}]});
  ok("丟掉沒有合法日期的訓練",n.workouts.length===1,n.workouts.map(w=>w.date).join(","));
  S=n;S.sample=false;renderAll();show("history");
  ok("紀錄頁照常顯示",document.querySelectorAll("#hist button.hitem").length===1);
}
{
  const n=normalize({workouts:[{date:"2026-09-01"},{date:"2026-08-30",exercises:[{name:"臥推"}]}],
    routines:[null,{id:"rx"},{name:"沒有 id",exercises:[]}],draft:{exercises:"亂寫"}});
  ok("補上缺少的 exercises 陣列",n.workouts.every(w=>Array.isArray(w.exercises)));
  ok("補上缺少的 sets 陣列",n.workouts[1].exercises.every(e=>Array.isArray(e.sets)));
  ok("丟掉壞掉的範本",n.routines.length===1&&n.routines[0].id==="rx",JSON.stringify(n.routines));
  ok("丟掉壞掉的進行中訓練",n.draft===null);
}
{
  const n=normalize({workouts:[
    {date:"2026-09-01",exercises:[null,{name:"臥推",sets:[{kg:60,reps:5},null]},{sets:[]}]}],
    routines:[{id:"r",exercises:[null,{name:"臥推",sets:3}]}]});
  ok("丟掉壞掉的動作項目",n.workouts[0].exercises.length===1&&n.workouts[0].exercises[0].name==="臥推",
     JSON.stringify(n.workouts[0].exercises));
  ok("丟掉壞掉的組",n.workouts[0].exercises[0].sets.length===1);
  ok("範本裡壞掉的動作也丟掉",n.routines[0].exercises.length===1);
  S=n;S.sample=false;renderAll();show("history");
  ok("這種資料也 render 得出來",document.querySelectorAll("#hist button.hitem").length===1);
}
{
  const n=normalize({workouts:[],bodyweight:[
    {date:"2026-08-01",kg:70},{date:"2026-08-01",kg:71},{date:"2026-08-02",kg:72},null,{date:"2026-08-03"}]});
  ok("同一天的體重只留一筆",n.bodyweight.length===2,JSON.stringify(n.bodyweight));
  ok("留下的是後寫入的那筆",n.bodyweight.find(b=>b.date==="2026-08-01").kg===71);
}

/* ============================ 修改訓練紀錄 ============================ */
G("修改訓練紀錄");
fresh();show("history");
ok("每一筆都是可點的卡片",document.querySelectorAll("#hist button.hitem").length===S.workouts.length);
{
  const id=S.workouts[1].id, before=JSON.stringify(S.workouts[1]);
  card(1).click();
  ok("點了會打開修改畫面",!$("w-edit").hidden&&$("hist-head").hidden);
  ok("帶入原本的日期",$("w-date").value===S.workouts[1].date,$("w-date").value);
  ok("列出全部動作",$("w-list").querySelectorAll(".panel.ex").length===S.workouts[1].exercises.length);
  ok("動作選擇面板移進修改畫面",$("w-picker-slot").contains($("picker-panel")));
  const i=$("w-list").querySelector("tbody input");i.value="123.5";i.dispatchEvent(new Event("input"));
  ok("按儲存前不會動到資料",JSON.stringify(S.workouts.find(w=>w.id===id))===before);
  $("w-save").click();
  ok("儲存寫回正確那一筆",S.workouts.find(w=>w.id===id).exercises[0].sets[0].kg===123.5);
  ok("儲存後關閉修改畫面",$("w-edit").hidden&&!$("hist-head").hidden);
}
{
  const id=S.workouts[0].id, before=JSON.stringify(S.workouts[0]);
  card(0).click();
  const i=$("w-list").querySelector("tbody input");i.value="999";i.dispatchEvent(new Event("input"));
  $("w-cancel").click();
  ok("取消完全不動原紀錄",JSON.stringify(S.workouts.find(w=>w.id===id))===before);
}
{
  card(0).click();
  $("w-date").value="2099-01-01";$("w-date").dispatchEvent(new Event("change"));
  ok("擋下未來的日期",wEdit.date!=="2099-01-01",wEdit.date);
  const today=ymd(new Date());
  $("w-date").value=today;$("w-date").dispatchEvent(new Event("change"));
  $("w-save").click();
  ok("改日期後重新排序",S.workouts.every((w,i)=>i===0||S.workouts[i-1].date>=w.date));
}
{
  const n=S.workouts.length, id=S.workouts[1].id;
  card(1).click();
  $("w-delete").click();
  ok("刪除要先確認",!$("w-del-confirm").hidden);
  $("w-del-yes").click();
  ok("只刪掉那一筆",S.workouts.length===n-1&&!S.workouts.some(w=>w.id===id),n+" -> "+S.workouts.length);
}
{
  // changing the date and then deleting must report the date the record really had
  const today=ymd(new Date());
  const idx=S.workouts.findIndex(w=>w.date!==today);
  card(idx).click();
  const real=parse(wEdit.date);
  $("w-date").value=today;$("w-date").dispatchEvent(new Event("change"));
  ok("日期先被改掉但還沒存",wEdit.date===today&&S.workouts.some(w=>w.id===wEdit.id&&w.date!==today));
  $("w-delete").click();$("w-del-yes").click();
  const t=$("toast").textContent, now=parse(today);
  ok("刪除訊息用真正的日期",t.includes(`${real.getMonth()+1} 月 ${real.getDate()} 日`),t);
  ok("而不是改過還沒存的日期",!t.includes(`${now.getMonth()+1} 月 ${now.getDate()} 日`),t);
}
{
  card(0).click();
  const n=wEdit.exercises.length;
  addEx("腿推機");
  ok("可以加入動作",wEdit.exercises.length===n+1);
  $("w-save").click();
  ok("沒填次數的新動作不會存進去",!S.workouts[0].exercises.some(e=>e.name==="腿推機"));
}
{
  card(0).click();
  const name=wEdit.exercises[0].name, n=wEdit.exercises.length;
  wEdit.exercises[0].sets.forEach(st=>st.reps="");
  $("w-save").click();
  ok("整個動作被清空時擋下來",!$("w-edit").hidden);
  ok("訊息指出是哪個動作",$("toast").textContent.includes(name),$("toast").textContent);
  ok("沒有偷偷刪掉那個動作",S.workouts[0].exercises.length===n);
  wEdit.exercises[0].sets[0].reps=5;$("w-save").click();
  ok("補上次數就能存",$("w-edit").hidden);
}
{
  card(0).click();
  const d=wEdit.date;
  $("w-cancel").click();
  $("w-date").value="";$("w-date").dispatchEvent(new Event("change"));
  ok("關閉後才送達的 change 不會爆掉",true);
  card(0).click();
  ok("修改畫面還能正常開",wEdit&&wEdit.date===d);
  $("w-cancel").click();
}

/* ============================ 數值檢查 ============================ */
G("數值檢查");
fresh();show("history");
{
  card(0).click();
  const before=JSON.stringify(S.workouts[0]);
  wEdit.exercises[0].sets[0].reps=-5;$("w-save").click();
  ok("擋下負的次數",!$("w-edit").hidden&&$("toast").textContent.includes("次數"),$("toast").textContent);
  ok("擋下時什麼都沒存",JSON.stringify(S.workouts[0])===before);
  wEdit.exercises[0].sets[0].reps=0;$("w-save").click();
  ok("擋下 0 次",!$("w-edit").hidden);
  wEdit.exercises[0].sets[0].reps=5;wEdit.exercises[0].sets[0].kg=-5;$("w-save").click();
  ok("擋下負的重量",!$("w-edit").hidden&&$("toast").textContent.includes("重量"),$("toast").textContent);
  wEdit.exercises[0].sets[0].kg=60;$("w-save").click();
  ok("合理的數字存得進去",$("w-edit").hidden);
}
{
  card(0).click();
  const n=S.workouts[0].exercises.length;
  wEdit.exercises[0].sets.push({kg:9999,reps:""});
  $("w-save").click();
  ok("空白列不會卡住儲存",$("w-edit").hidden&&S.workouts[0].exercises.length===n);
}
{
  show("today");startRoutine(S.routines[0]);
  S.draft.exercises[0].sets=[{kg:100,reps:-3,done:true},{kg:9999,reps:5,done:false}];
  $("finish").click();
  ok("完成訓練也擋負的次數",!!S.draft&&$("toast").textContent.includes("次數"),$("toast").textContent);
  S.draft.exercises[0].sets[0].reps=5;
  $("finish").click();$("finish-yes").click();
  ok("沒打勾的亂數字不影響完成訓練",S.draft===null);
}

/* ============================ 自訂動作 ============================ */
G("自訂動作");
fresh();show("today");startRoutine(S.routines[0]);
ok("沒有自訂動作時不顯示管理按鈕",$("custom-manage").hidden);
{
  $("custom-open").click();typeName("測試動作甲");
  $("c-g").value="胸";$("c-eq").value="槓鈴";submitCustom();
  ok("新增進動作庫",S.custom.length===1&&S.custom[0].name==="測試動作甲",JSON.stringify(S.custom));
  ok("同時加進今天的訓練",S.draft.exercises.some(e=>e.name==="測試動作甲"));
  ok("新增後出現管理按鈕",!$("custom-manage").hidden);
}
{
  $("custom-open").click();typeName("臥推");submitCustom();
  ok("擋下與內建動作同名",!S.custom.some(x=>x.name==="臥推"));
  closeCustomForm();
}
{
  S.draft.exercises.find(e=>e.name==="測試動作甲").sets=[{kg:60,reps:5,done:true}];
  S.settings.exRest["測試動作甲"]=150;
  $("finish").click();$("finish-yes").click();
  S.routines.push({id:"rt",name:"測試範本",exercises:[{name:"測試動作甲",sets:3}]});save();
  const pr=bests()["測試動作甲"].e;
  openManage();
  ok("管理清單列出自訂動作",!$("custom-box").hidden&&$("custom-list").children.length===1);
  ok("顯示用到的筆數",$("custom-list").querySelector("li").textContent.includes("1 筆"));
  firstRow()[0].click();
  ok("編輯表單帶入現有內容",$("c-name").value==="測試動作甲"&&$("c-g").value==="胸"&&$("c-eq").value==="槓鈴");
  ok("按鈕變成儲存修改",$("c-submit").textContent==="儲存修改");
  ok("先說明會影響幾筆",$("c-hint").textContent.includes("1 筆"),$("c-hint").textContent);
  typeName("測試動作乙");$("c-g").value="肩";submitCustom();
  ok("動作庫更新",S.custom[0].name==="測試動作乙"&&S.custom[0].g==="肩");
  ok("過去的紀錄跟著改名",S.workouts[0].exercises.some(e=>e.name==="測試動作乙"));
  ok("沒有留下孤兒",!S.workouts.some(w=>w.exercises.some(e=>e.name==="測試動作甲")));
  ok("範本跟著改名",S.routines.find(r=>r.id==="rt").exercises[0].name==="測試動作乙");
  ok("休息設定跟著搬家",S.settings.exRest["測試動作乙"]===150&&S.settings.exRest["測試動作甲"]===undefined);
  ok("個人紀錄接得上",Math.abs(bests()["測試動作乙"].e-pr)<1e-9&&!bests()["測試動作甲"]);
  ok("部位改變反映在查詢上",G2("測試動作乙")==="肩",G2("測試動作乙"));
}
{
  openManage();firstRow()[0].click();
  typeName("臥推");
  ok("提示指出名字已被佔用",$("c-hint").textContent.includes("已經有"),$("c-hint").textContent);
  submitCustom();
  ok("送出也被擋下",S.custom[0].name==="測試動作乙");
  typeName("測試動作乙");submitCustom();
  ok("名字沒改也能存",S.custom[0].name==="測試動作乙"&&$("custom-form").hidden);
}
{
  openManage();
  const n=S.workouts.length;
  firstRow()[1].click();
  ok("移除前說明後果",!$("c-del-confirm").hidden&&$("c-del-msg").textContent.includes("留著"),$("c-del-msg").textContent);
  ok("並說明可以加回來",$("c-del-msg").textContent.includes("再加一次"));
  $("c-del-yes").click();
  ok("從動作庫移除",!allEx().some(x=>x.name==="測試動作乙"));
  ok("訓練紀錄留著",S.workouts.length===n&&S.workouts.some(w=>w.exercises.some(e=>e.name==="測試動作乙")));
  ok("範本也留著",S.routines.find(r=>r.id==="rt").exercises[0].name==="測試動作乙");
  ok("沒有自訂動作時收起管理區",$("custom-manage").hidden&&$("custom-box").hidden);
}
{
  show("today");startRoutine(S.routines[0]);
  $("custom-open").click();typeName("測試動作乙");
  ok("提示說會接回舊紀錄",!$("c-hint").hidden&&$("c-hint").textContent.includes("接回"),$("c-hint").textContent);
  $("c-g").value="胸";$("c-eq").value="槓鈴";submitCustom();
  ok("可以用同樣的名字加回來",S.custom.some(x=>x.name==="測試動作乙"));
  ok("加回來時也加進今天的訓練",S.draft.exercises.some(e=>e.name==="測試動作乙"));
  ok("提示訊息講明接回幾筆",$("toast").textContent.includes("接回"),$("toast").textContent);
  ok("舊紀錄接回動作庫",G2("測試動作乙")==="胸",G2("測試動作乙"));
}
{
  openManage();firstRow()[1].click();
  ok("排定移除",!$("c-del-confirm").hidden);
  firstRow()[0].click();
  ok("改去按編輯就取消移除",$("c-del-confirm").hidden);
  const n=S.custom.length;
  typeName("測試動作丙");submitCustom();
  ok("改名有生效",S.custom[0].name==="測試動作丙");
  ok("而且什麼都沒被移除",S.custom.length===n,n+" -> "+S.custom.length);
}
{
  fresh();show("today");startRoutine(S.routines[0]);

  ok("範例資料第一個動作至少有三組（這段的前提）",n0>=3,String(n0));
  const keep=rows()[n0-1].querySelector("input");
  keep.focus();
  rows()[1].querySelector("button.iconbtn").click();   // a row from the middle
  ok("修改紀錄刪中間一列後焦點還在",document.activeElement===keep);
  ok("只少一列",rows().length===n0-1,n0+" -> "+rows().length);
  ok("資料也只少一組",wEdit.exercises[0].sets.length===n0-1);
  const seq=[...rows()].map(r=>r.firstElementChild.textContent).join(",");
  const want=Array.from({length:rows().length},(_,i)=>i+1).join(",");
  ok("剩下的列重新編號",seq===want,seq+"（期望 "+want+"）");
  const add=[...$("w-list").querySelectorAll(".panel.ex")[0].querySelectorAll("button")]
    .find(b=>b.textContent.indexOf("加一組")>=0);
  const before=rows().length;
  add.click();
  ok("加一組只追加一列",rows().length===before+1);
  ok("加一組後焦點依然保留",document.activeElement===keep);
  $("w-cancel").click();
}

/* ============================ 提示音 ============================ */
G("提示音實際產生的波形");
{
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  if(!OAC){ok("瀏覽器不支援離線音訊（略過）",true,"skipped");}
  else{
    const SR=44100, ctx=new OAC(1,SR,SR);
    Object.defineProperty(ctx,"state",{configurable:true,get:()=>"running"});
    const keep=audioCtx;audioCtx=ctx;
    realBeep();                                      // the real one, not the counter stub
    audioCtx=keep;
    // headless can leave startRendering() pending forever; never hang the suite on it
    const buf=await Promise.race([ctx.startRendering(),new Promise(r=>setTimeout(()=>r(null),8000))]);
    if(!buf){ok("離線音訊沒有在時限內算完（略過）",true,"skipped");}
    else{
    const d=buf.getChannelData(0);
    const peak=(a,b)=>{let m=0;for(let i=Math.round(a*SR);i<Math.round(b*SR)&&i<d.length;i++)m=Math.max(m,Math.abs(d[i]));return m};
    const t1=peak(0,0.17), t2=peak(0.18,0.35), tail=peak(0.45,1);
    ok("第一個音真的有聲音",t1>0.05,t1.toFixed(3));
    ok("第二個音真的有聲音",t2>0.05,t2.toFixed(3));
    ok("兩個音的音量相近",t2>t1*0.4,`${t1.toFixed(3)} vs ${t2.toFixed(3)}`);
    ok("結束後安靜下來",tail<0.01,tail.toFixed(4));
    }
  }
}

/* ============================ 計時器實際走時 ============================ */
G("計時器實際走完一次");
fresh();show("today");startRoutine(S.routines[0]);
{
  S.settings.alert=false;restAlerted=false;
  startRest(2);
  ok("開始時顯示 00:02",$("rest").textContent==="00:02",$("rest").textContent);
  await new Promise(r=>setTimeout(r,2400));          // no poking at restEnd: let it run
  ok("時間到會自己歸零",$("rest").textContent==="00:00",$("rest").textContent);
  ok("並進入結束狀態",document.querySelector(".restbox").classList.contains("ready"));
  ok("提醒已經觸發過",restAlerted===true);
  stopRest();
}

/* ============================ 版面 ============================ */
G("窄螢幕版面（"+document.documentElement.clientWidth+"px）");
{
  const de=document.documentElement;
  const noOverflow=label=>ok(label+"沒有橫向溢出",de.scrollWidth<=de.clientWidth+1,
    de.scrollWidth+" / "+de.clientWidth);
  fresh();
  show("today");noOverflow("今天（範本清單）");
  startRoutine(S.routines[0]);noOverflow("今天（訓練進行中）");
  openEdit(S.routines[0]);noOverflow("範本編輯");
  $("r-cancel").click();
  show("history");noOverflow("紀錄");
  document.querySelectorAll("#hist button.hitem")[0].click();noOverflow("修改紀錄");
  $("w-cancel").click();
  show("progress");noOverflow("進度");
  $("discard").click();$("discard-yes").click();
}

}catch(e){
  R.push({group:group||"（執行中斷）",name:"測試中途拋出例外",pass:false,detail:(e&&e.stack||e)+""});
}
parent.postMessage({liftsyncTest:true,results:R},"*");
})();
</script>

<script>
const out=document.getElementById("out"), tally=document.getElementById("tally");
const howto=document.getElementById("howto");
let onlyFail=false, running=false;

// The app writes to the same origin's localStorage, so take everything out of the way
// and put it back afterwards — running this must never cost somebody their training log.
let stash=null;
function stashStorage(){
  // A re-run started before the last one finished must NOT snapshot again: by then the
  // iframe has already written test data over everything, and that snapshot would be
  // restored as if it were the user's log. The first snapshot is the real one.
  if(stash)return;
  const snap={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);snap[k]=localStorage.getItem(k)}}
  catch(e){return}
  stash=snap;
}
function restoreStorage(){
  if(!stash)return;
  const snap=stash;stash=null;
  try{localStorage.clear();for(const k in snap)localStorage.setItem(k,snap[k])}catch(e){}
}
window.addEventListener("beforeunload",restoreStorage);

function render(){
  if(!lastResults)return;
  const pass=lastResults.filter(r=>r.pass).length, fail=lastResults.length-pass;
  tally.innerHTML=`<span class="p">${pass} 通過</span>　<span class="${fail?"f":""}">${fail} 失敗</span>`;
  document.title=(fail?`✗ ${fail} 失敗`:`✓ ${pass} 通過`)+" · LiftSync 測試";
  out.replaceChildren();
  let group=null, ul=null;
  for(const r of lastResults){
    if(onlyFail&&r.pass)continue;
    if(r.group!==group){
      group=r.group;
      const h=document.createElement("h2");h.textContent=group;out.append(h);
      ul=document.createElement("ul");out.append(ul);
    }
    const li=document.createElement("li");li.className=r.pass?"ok":"no";
    const tag=document.createElement("span");tag.className="tag";tag.textContent=r.pass?"PASS":"FAIL";
    const body=document.createElement("span");body.textContent=r.name;
    if(r.detail){
      const why=document.createElement("span");why.className="why";why.textContent=r.detail;body.append(why);
    }
    li.append(tag,body);ul.append(li);
  }
  if(onlyFail&&!fail){
    const p=document.createElement("p");p.className="note";p.textContent="沒有失敗的項目。";out.append(p);
  }
}

const ALL=[];
let frames=[];
function dropFrames(){frames.forEach(f=>f.remove());frames=[]}

function finish(){
  running=false;
  document.getElementById("rerun").disabled=false;
  restoreStorage();
  dropFrames();
  // opt-in hook so a script can run this page and read the outcome: ?report
  if(location.search.indexOf("report")>=0){
    try{fetch("__result",{method:"POST",body:JSON.stringify(ALL)})}catch(e){}
  }
}

function loadApp(){
  return new Promise((res,rej)=>{
    const f=document.createElement("iframe");
    frames.push(f);
    const bail=setTimeout(()=>rej(new Error("index.html 載入逾時")),15000);
    f.addEventListener("load",()=>{clearTimeout(bail);res(f)});
    f.src="index.html?t="+Date.now()+"-"+Math.random();   // never a cached copy
    document.body.appendChild(f);
  });
}
// The probe has to run inside the app's window: the app's top-level let/const bindings
// never become properties of globalThis, so there is no reaching them from out here.
function probe(f,code,ms){
  return new Promise((res,rej)=>{
    const bail=setTimeout(()=>{window.removeEventListener("message",on);rej(new Error("沒有回報結果"))},ms||25000);
    function on(e){
      if(!e.data||!e.data.liftsyncTest)return;
      clearTimeout(bail);window.removeEventListener("message",on);res(e.data.results);
    }
    window.addEventListener("message",on);
    let doc=null;
    try{doc=f.contentDocument}catch(err){}
    if(!doc||!doc.body){clearTimeout(bail);window.removeEventListener("message",on);rej(new Error("no-access"));return}
    // surface a syntax error in the injected script instead of just timing out
    try{f.contentWindow.addEventListener("error",ev=>{
      clearTimeout(bail);window.removeEventListener("message",on);
      rej(new Error((ev.message||"script error")+" @"+(ev.lineno||"?")));
    })}catch(err){}
    const bridge=doc.createElement("script");
    bridge.textContent="window.G2=G;";          // G is the app's muscle-group lookup
    doc.body.appendChild(bridge);
    const sc=doc.createElement("script");
    sc.textContent=code;
    doc.body.appendChild(sc);
  });
}

const REPORT='const R=[];const ok=(n,c,d)=>R.push({group:GRP,name:n,pass:!!c,detail:d==null?"":String(d)});'+
             'const done=()=>parent.postMessage({liftsyncTest:true,results:R},"*");';

function note(group,name,pass,detail){ALL.push({group,name,pass,detail:detail==null?"":String(detail)})}

/* ---------------- phase 1: the app, driven through its own UI ---------------- */
async function phaseMain(){
  const f=await loadApp();
  try{ ALL.push(...await probe(f,document.getElementById("suite").textContent)); }
  finally{ f.remove(); frames=frames.filter(x=>x!==f); }   // a live app keeps writing storage
}

/* ---------------- phase 2: cold starts, with storage seeded first ---------------- */
const COLD=[
  {
    name:"冷啟動：舊版 ironlog 資料",
    seed(){
      localStorage.clear();
      localStorage.setItem("ironlog-v1",JSON.stringify({ver:3,sample:false,
        workouts:[{date:"2026-05-05",exercises:[{name:"臥推",sets:[{kg:60,reps:5}]}]}],
        bodyweight:[],custom:[],routines:[],settings:{rest:90,exRest:{}}}));
      localStorage.setItem("ironlog-v1-tab","progress");
    },
    code:`const GRP="冷啟動：改名前的舊資料";${'$'}{REPORT}
      ok("讀得到 ironlog-v1 的紀錄",S.workouts.length===1&&S.workouts[0].exercises[0].name==="臥推",
         JSON.stringify(S.workouts.map(w=>w.date)));
      ok("沒有退回範例資料",S.sample!==true);
      ok("順手補上了 id",!!S.workouts[0].id,S.workouts[0].id);
      ok("記得上次看的分頁",!${'$'}("tab-progress").hidden);
      done();`
  },
  {
    name:"冷啟動：結構壞掉的資料",
    seed(){
      localStorage.clear();
      localStorage.setItem("liftsync-v1",JSON.stringify({ver:3,sample:false,
        workouts:[{date:"2026-05-05",exercises:[null,{name:"臥推",sets:[null,{kg:60,reps:5}]}]},
                  null,{exercises:[]},{date:"亂寫"}],
        routines:[null,{id:"rr",name:"壞的",exercises:[null,{name:"臥推",sets:2}]}],
        bodyweight:[null,{date:"2026-05-01",kg:70},{date:"2026-05-01",kg:71}],
        custom:{},settings:null,draft:{exercises:"亂寫"}}));
    },
    code:`const GRP="冷啟動：結構壞掉的資料";${'$'}{REPORT}
      ok("App 有啟動起來",typeof S==="object"&&!!S);
      ok("只留下能用的那筆訓練",S.workouts.length===1,JSON.stringify(S.workouts.map(w=>w.date)));
      ok("壞掉的動作被濾掉",S.workouts[0].exercises.length===1);
      ok("壞掉的組被濾掉",S.workouts[0].exercises[0].sets.length===1);
      ok("壞掉的範本被濾掉",S.routines.length===1&&S.routines[0].exercises.length===1);
      ok("同日體重只留一筆",S.bodyweight.length===1&&S.bodyweight[0].kg===71);
      ok("custom 變成陣列",Array.isArray(S.custom));
      ok("壞掉的 draft 被丟掉",S.draft===null);
      ok("畫面真的畫出來了",document.querySelectorAll("#routines .rcard").length===1);
      done();`
  },
  {
    name:"冷啟動：完全不是 JSON",
    seed(){localStorage.clear();localStorage.setItem("liftsync-v1","{{{這不是 JSON")},
    code:`const GRP="冷啟動：完全不是 JSON";${'$'}{REPORT}
      ok("退回範例資料而不是白畫面",Array.isArray(S.workouts)&&S.workouts.length>0,String(S.workouts.length));
      ok("範本也畫出來了",document.querySelectorAll("#routines .rcard").length>0);
      done();`
  },
  {
    name:"冷啟動：接回還在跑的休息",
    seed(){
      localStorage.clear();
      localStorage.setItem("liftsync-v1",JSON.stringify({ver:3,sample:false,workouts:[],bodyweight:[],
        custom:[],routines:[],settings:{rest:90,exRest:{}},
        draft:{date:"2026-05-05",exercises:[{name:"臥推",sets:[{kg:60,reps:5,done:true}]}]}}));
      localStorage.setItem("liftsync-v1-rest",JSON.stringify({end:Date.now()+65500,total:90,alerted:false}));
    },
    code:`const GRP="冷啟動：接回還在跑的休息";${'$'}{REPORT}
      ok("倒數接了回來",restEnd>Date.now(),String(restEnd-Date.now()));
      ok("剩餘秒數正確",/^01:0[3-6]$/.test(${'$'}("rest").textContent),${'$'}("rest").textContent);
      done();`
  },
  {
    name:"冷啟動：太久以前的休息",
    seed(){
      localStorage.clear();
      localStorage.setItem("liftsync-v1",JSON.stringify({ver:3,sample:false,workouts:[],bodyweight:[],
        custom:[],routines:[],settings:{rest:90,exRest:{}},
        draft:{date:"2026-05-05",exercises:[]}}));
      localStorage.setItem("liftsync-v1-rest",JSON.stringify({end:Date.now()-20*60*1000,total:90,alerted:false}));
    },
    code:`const GRP="冷啟動：太久以前的休息";${'$'}{REPORT}
      ok("不會復活",restEnd===0,String(restEnd));
      ok("存檔也清掉了",localStorage.getItem("liftsync-v1-rest")===null);
      ok("顯示預設休息時間而不是 NaN",${'$'}("rest").textContent.indexOf("NaN")<0,${'$'}("rest").textContent);
      done();`
  }
];

async function phaseCold(){
  for(const c of COLD){
    try{
      c.seed();
      const f=await loadApp();
      try{ ALL.push(...await probe(f,c.code.replace(/\$\{REPORT\}/g,REPORT))); }
      finally{ f.remove(); frames=frames.filter(x=>x!==f); }
    }catch(e){
      note(c.name,"這個情境跑不起來",false,(e&&e.message)||e);
    }
  }
}

/* ---------------- phase 3: the service worker, registered for real ---------------- */
async function phaseSW(){
  const GRP="Service worker（真的註冊一次）";
  const ok=(n,c,d)=>note(GRP,n,!!c,d);
  if(!navigator.serviceWorker||!window.caches){ok("這個環境沒有 service worker（略過）",true,"skipped");return}
  try{
    for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();
    for(const k of await caches.keys())await caches.delete(k);
    await caches.open("liftsync-stale-for-test");      // activation should sweep this away

    const src=await (await fetch("sw.js?v="+Date.now(),{cache:"no-store"})).text();
    const ver=(src.match(/VERSION\s*=\s*"([^"]+)"/)||[])[1];
    const shell=((src.match(/const SHELL\s*=\s*\[([\s\S]*?)\];/)||[,""])[1].match(/"[^"]+"/g)||[])
      .map(q=>q.slice(1,-1));
    ok("sw.js 讀得到版本號",!!ver,ver);
    ok("預快取清單解析得出來",shell.length>0,shell.length+" 個");

    // The app iframes in the earlier phases already registered sw.js and clients.claim()
    // took over this page too, so plain register("sw.js") would just hand back that
    // existing worker — no install, no activate, nothing to check. A distinct script URL
    // (same file, same "/" scope) forces a real install and activation.
    const cap=(pr,ms,what)=>Promise.race([pr,
      new Promise(r=>setTimeout(()=>r("__timeout:"+what),ms))]);
    const reg=await navigator.serviceWorker.register("sw.js?ci="+Date.now());
    // a failed install leaves no active worker, and ready would then never settle
    const rdy=await cap(navigator.serviceWorker.ready,10000,"ready");
    ok("安裝沒有卡住",rdy!=="__timeout:ready",
       rdy==="__timeout:ready"?"serviceWorker.ready 逾時，多半是預快取清單有檔案抓不到":"");
    for(let i=0;i<120&&!(reg.active&&reg.active.state==="activated");i++)await new Promise(r=>setTimeout(r,50));
    ok("安裝並啟用成功",!!(reg.active&&reg.active.state==="activated"),reg.active&&reg.active.state);

    let keys=await caches.keys();
    for(let i=0;i<40&&keys.includes("liftsync-stale-for-test");i++){
      await new Promise(r=>setTimeout(r,50));keys=await caches.keys();
    }
    ok("建立了這個版本的快取",keys.includes(ver),keys.join(",")+" ← 期望 "+ver);
    ok("舊版本的快取被清掉",!keys.includes("liftsync-stale-for-test"),keys.join(","));

    const c=await caches.open(ver);
    const missing=[];
    for(const u of shell)if(!(await c.match(u)))missing.push(u);
    ok("預快取的檔案全部都在",missing.length===0,missing.join(", ")||(shell.length+" 個都在"));

    for(let i=0;i<60&&!navigator.serviceWorker.controller;i++)await new Promise(r=>setTimeout(r,50));
    ok("已經接管這個頁面",!!navigator.serviceWorker.controller);
    // a URL the server does not have, but the cache does — only the SW can answer it
    await c.put("./__sw_probe.txt",new Response("from-cache",{headers:{"content-type":"text/plain"}}));
    const direct=await fetch("./__sw_probe.txt");
    const body=await direct.text();
    ok("離線時會從快取回應",body==="from-cache",body.slice(0,40));

    ok("有處理點擊通知",/addEventListener\("notificationclick"/.test(src));
    // the worker answers same-origin GETs from cache first, so ask for a URL it has
    // never seen — this check is about the file on the server, not the cached copy
    const page=await (await fetch("index.html?v="+Date.now(),{cache:"no-store"})).text();
    const tag=(page.match(/<!--\s*LiftSync v([\d.]+)\s*-->/)||[])[1];
    ok("index.html 的版本註記跟 sw.js 一致",ver==="liftsync-"+tag,"index.html="+tag+" / sw.js="+ver);
    ok("通知圖示有進預快取",shell.some(u=>u.indexOf("icon-96")>=0)||shell.some(u=>u.indexOf("icon-192")>=0),
       shell.filter(u=>u.indexOf("icon")>=0).join(", "));
  }catch(e){
    ok("service worker 測試拋出例外",false,(e&&e.message)||e);
  }finally{
    try{
      for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();
      for(const k of await caches.keys())await caches.delete(k);
    }catch(e){}
  }
}

function render(){
  const pass=ALL.filter(r=>r.pass).length, fail=ALL.length-pass;
  tally.innerHTML=`<span class="p">${pass} 通過</span>　<span class="${fail?"f":""}">${fail} 失敗</span>`;
  document.title=(fail?`✗ ${fail} 失敗`:`✓ ${pass} 通過`)+" · LiftSync 測試";
  out.replaceChildren();
  let group=null, ul=null;
  for(const r of ALL){
    if(onlyFail&&r.pass)continue;
    if(r.group!==group){
      group=r.group;
      const h=document.createElement("h2");h.textContent=group;out.append(h);
      ul=document.createElement("ul");out.append(ul);
    }
    const li=document.createElement("li");li.className=r.pass?"ok":"no";
    const tag=document.createElement("span");tag.className="tag";tag.textContent=r.pass?"PASS":"FAIL";
    const body=document.createElement("span");body.textContent=r.name;
    if(r.detail){
      const why=document.createElement("span");why.className="why";why.textContent=r.detail;body.append(why);
    }
    li.append(tag,body);ul.append(li);
  }
  if(onlyFail&&!fail){
    const p=document.createElement("p");p.className="note";p.textContent="沒有失敗的項目。";out.append(p);
  }
}

async function run(){
  if(running)return;                 // one run at a time, or the stash gets clobbered
  running=true;document.getElementById("rerun").disabled=true;
  onlyFail=false;ALL.length=0;
  tally.textContent="執行中…";out.replaceChildren();
  // Housekeeping only — a stale service worker would serve a cached index.html and the
  // suite would quietly test yesterday's app. It must never be able to block the run,
  // though: CacheStorage can simply never settle in a headless browser.
  const capped=p=>Promise.race([p,new Promise(r=>setTimeout(r,1500))]);
  try{
    await capped((async()=>{
      if(navigator.serviceWorker){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      if(window.caches){
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
    })());
  }catch(e){}
  stashStorage();
  dropFrames();
  const phases=[["App 本體",phaseMain],["冷啟動",phaseCold],["Service worker",phaseSW]];
  for(const [label,fn] of phases){
    try{ await fn(); }
    catch(e){
      if((e&&e.message)==="no-access"){
        howto.style.borderLeftColor="var(--fail)";
        tally.innerHTML='<span class="f">無法讀取 index.html</span>';
        finish();return;
      }
      note(label,"這個階段沒有跑完",false,(e&&e.message)||e);
    }
    howto.classList.add("hide");
    render();
  }
  finish();
  render();
}

document.getElementById("rerun").addEventListener("click",run);
document.getElementById("onlyfail").addEventListener("click",()=>{onlyFail=!onlyFail;render()});
run();
</script>
